# Publishes the online preview of the site on GitHub Pages
# every time the code is pushed. (Demo data only — no server, no MySQL.)
name: Online preview (GitHub Pages)

on:
  push:
    branches: ['claude/compassionate-fermi-sip98n', 'main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix client
      - run: npm run build:demo --prefix client
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist-demo
      - id: deployment
        uses: actions/deploy-pages@v4
